<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить питомца</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <h1>Добавить нового питомца</h1>
    
    <form id="addPetForm">
        <label>Имя питомца:</label>
        <input type="text" name="pet_name" required>
        
        <label>Тип питомца:</label>
        <select name="pet_type" required>
            <option value="dog">Собака</option>
            <option value="cat">Кошка</option>
            <option value="bird">Птица</option>
            <option value="rodent">Грызун</option>
        </select>
        
        <label>Порода:</label>
        <input type="text" name="breed">
        
        <label>Возраст (лет):</label>
        <input type="number" name="age" min="1">
        
        <label>Пол:</label>
        <select name="gender" required>
            <option value="male">Мужской</option>
            <option value="female">Женский</option>
            <option value="ster">Стерилизованная</option>
            <option value="kastr">Кастрированная</option>
        </select>
        
        <label>Вес до (кг):</label>
        <input type="number" step="0.01" name="weight_before">
        
        <label>Вес после (кг):</label>
        <input type="number" step="0.01" name="weight_after">
        
        <label>Размер:</label>
        <select name="size">
            <option value="small">Маленький</option>
            <option value="medium">Средний</option>
            <option value="large">Большой</option>
        </select>
        
        <label>ID владельца:</label>
        <input type="number" name="owner_id" required>
        
        <label>ID бронирования:</label>
        <input type="number" name="booking_id">
        
        <button type="submit">Добавить питомца</button>
    </form>
    
    <div id="message"></div>
    
    <script src="./scripts/main.js"></script>
</body>
</html>
