<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <link href="" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css?family=Montserrat:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic"
        rel="stylesheet" />
    <title>Зоогостиница</title>
</head>

<body>
    <!-- <header>
        <div class="wrapper">  
        </div>
    </header> -->
    <main>
        <div class="wrapper">
            <div class="registration-block">
                <div class="reregistration__photo"></div>
                <div class="registration__form">
                    <h1 class="registration__h1">Добро пожаловать!</h1>
                    <form action="#" method="post">
                        <div class="registration__body_form">
                            <div>
                                <label for="name">Имя</label>
                                <input type="text" id="name" name="name" placeholder="Введите имя">
                                <label for="surname">Фамилия</label>
                                <input type="text" id="surname" name="surname" placeholder="Введите фамилию">
                            </div>
                            <div>
                                <label for="email">Почта</label>
                                <input type="email" id="email" name="email" placeholder="Введите почту">
                                <label for="phone">Телефон</label>
                                <input type="phone" id="phone" name="phone" placeholder="Введите телефон">
                            </div>
                        </div>
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password">
                        <button type="submit">Зарегистрироваться</button>
                        <div class="registration__sign_in">У вас уже есть аккаунт?  <a href="signin.html">Войти</a></div>
                       
                    </form>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="wrapper"></div>
    </footer>
</body>

</html>
