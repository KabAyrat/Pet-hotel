<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <link href="" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css?family=Montserrat:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic"
        rel="stylesheet" />
    <title>Зоогостиница</title>
</head>

<body>
    <header>
        <div class="wrapper">
            <div class="header">
                <div class="header__logo">
                    hotel
                    <!-- <img src="" alt=""> -->
                </div>
                <nav class="header__menu">
                    <div class="header__main_page">Главная</div>
                    <div class="header__contacts">Контакты</div>
                    <div class="header__faq">Контакты</div>
                    <div class="header__faq">Частые вопросы </div>
                </nav>
                <div class="btn">
                    <a href="index.html" class="header__btn">Войти
                    </a>
                </div>
            </div>
        </div>
    </header>
    <main>
        <div class="wrapper">
            <div class="main__main">
                <h1 class="main__h1">Добрый день, анна залупкина</h1>
                <div class="main__body">
                    <nav class="main__menu">
                        <div class="nav__profile">Профиль</div>
                        <div class="nav__pet">Ваш&nbsp;питомец</div>
                        <div class="nav__basket">Корзина</div>
                        <div class="nav__history">История </div>
                    </nav>
                    <div class="main__main-part">
                        <h2 class="main__h2">Личные данные</h2>
                        <form action="#" method="post">
                            <div class="registration__body_form">
                                <div>
                                    <label for="name">Имя</label>
                                    <input type="text" id="name" name="name" placeholder="Введите имя">
                                    <label for="surname">Фамилия</label>
                                    <input type="text" id="surname" name="surname" placeholder="Введите фамилию">
                                </div>
                                <div>
                                    <label for="email">Почта</label>
                                    <input type="email" id="email" name="email" placeholder="Введите почту">
                                    <label for="phone">Телефон</label>
                                    <input type="phone" id="phone" name="phone" placeholder="Введите телефон">
                                </div>
                            </div>
                            <label for="password">Пароль</label>
                            <input type="password" id="password" name="password">
                            <button type="submit">Сохранить </button>

                        </form>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </main>
    <footer>
        <div class="wrapper"></div>
    </footer>
</body>

</html>
